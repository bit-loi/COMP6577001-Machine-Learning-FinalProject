name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: find . -path ./node_modules -prune -o -path ./ml_services/venv -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install ML dependencies
        run: pip install -r ml_services/requirements.txt

      - name: Check ML Python syntax
        run: python -m py_compile ml_services/*.py

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    needs:
      - quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Shopmart web image
        run: docker build -t shopmart-web:ci .

      - name: Build ML service image
        run: docker build -t shopmart-ml-service:ci ./ml_services

  deploy-huggingface:
    name: Deploy ML service to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs:
      - quality
      - docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when Hugging Face secrets are missing
        if: env.HF_TOKEN == '' || env.HF_SPACE_REPO == ''
        run: echo "Skipping Hugging Face deploy because HF_TOKEN or HF_SPACE_REPO is not configured."

      - name: Push ML service to Hugging Face Space
        if: env.HF_TOKEN != '' && env.HF_SPACE_REPO != ''
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          git clone "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}" hf-deploy
          rsync -a --delete \
            --exclude hf-space \
            --exclude venv \
            --exclude __pycache__ \
            --exclude .env \
            ml_services/ hf-deploy/
          cd hf-deploy
          git add .
          if git diff --cached --quiet; then
            echo "No Hugging Face Space changes to deploy."
          else
            git commit -m "Deploy Shopmart ML service"
            git push
          fi
