version: '3.8'

services:
  # PHP Apache Web Server
  web:
    build: .
    container_name: shopmart-web
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - shopmart-network
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    restart: unless-stopped

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: shopmart-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shopmart
      MYSQL_USER: shopmart_user
      MYSQL_PASSWORD: shopmart_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - shopmart-network
    restart: unless-stopped

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: shopmart-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - shopmart-network
    restart: unless-stopped

networks:
  shopmart-network:
    driver: bridge

volumes:
  db_data:
    driver: local
